<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; media-src 'self' file: blob:">
  <title>Udha</title>
  <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="titlebar">
      <div class="brand"><span class="brand-mark"></span>Udha</div>
      <div class="titlebar-center">
        <button class="search-trigger" id="paletteBtn" title="Find a session (Ctrl+K)">
          <svg viewBox="0 0 16 16" width="13" height="13"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span>Search sessions</span><kbd>Ctrl K</kbd>
        </button>
      </div>
    </header>

    <div class="main">
      <nav class="nav">
        <div class="nav-group">
          <button class="nav-row active" data-section="sessions">
            <svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5 7l2 1.5L5 10M8.5 10H11" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Sessions</span><span class="nav-count" id="navCount"></span>
          </button>
          <button class="nav-row" data-section="meetings">
            <svg viewBox="0 0 16 16"><rect x="5.5" y="1.8" width="5" height="8.2" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3.2 7.5a4.8 4.8 0 0 0 9.6 0M8 12.3v2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            <span>Meetings</span>
          </button>
          <button class="nav-row" data-section="inbox">
            <svg viewBox="0 0 16 16"><path d="M2 9.5l1.6-5.4A1.5 1.5 0 0 1 5 3h6a1.5 1.5 0 0 1 1.4 1.1L14 9.5v2A1.5 1.5 0 0 1 12.5 13h-9A1.5 1.5 0 0 1 2 11.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M2 9.5h3.5l1 1.5h3l1-1.5H14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
            <span>Inbox</span><span class="nav-count"></span>
          </button>
          <button class="nav-row" data-section="videos">
            <svg viewBox="0 0 16 16"><rect x="1.8" y="4" width="9" height="8" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.8 7l3.4-2v6l-3.4-2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
            <span>Videos</span>
          </button>
          <button class="nav-row" data-section="agents">
            <svg viewBox="0 0 16 16"><path d="M8 1.8l1.4 3.3 3.3 1.4-3.3 1.4L8 11.2 6.6 7.9 3.3 6.5l3.3-1.4zM12.5 10.5l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4-1.4-.6 1.4-.6z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
            <span>Agents</span>
          </button>
          <button class="nav-row" data-section="machines">
            <svg viewBox="0 0 16 16"><rect x="2" y="2.5" width="12" height="8.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 13.5h5M8 11v2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            <span>Machines</span>
          </button>
          <button class="nav-row" data-section="usage">
            <svg viewBox="0 0 16 16"><path d="M2.5 11.5a5.5 5.5 0 1 1 11 0" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M8 11.5l2.6-3.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            <span>Usage</span>
          </button>
        </div>
        <div class="nav-spacer"></div>
        <div class="nav-group">
          <button class="nav-row" id="lockBtn" title="Lock keyboard and mouse; sessions keep running">
            <svg viewBox="0 0 16 16"><rect x="3" y="7" width="10" height="7" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5.2 7V5.2a2.8 2.8 0 0 1 5.6 0V7" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
            <span>Lock input</span>
          </button>
          <button class="nav-row" id="settingsBtn">
            <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M3.6 12.4 5 11M11 5l1.4-1.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            <span>Settings</span>
          </button>
        </div>
      </nav>

      <aside class="board" id="sessionsBoard" data-for="sessions">
        <div class="board-head">
          <div class="board-title">
            <span class="live-dot" id="hostDot"></span>
            <span id="hostName">This PC</span>
            <span class="board-count" id="boardCount"></span>
          </div>
          <button class="btn primary sm" id="newBtn" title="New session (Ctrl+N)">
            <svg viewBox="0 0 16 16" width="11" height="11"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            New
          </button>
        </div>
        <div class="board-search">
          <input id="filter" type="search" placeholder="Filter" spellcheck="false">
        </div>
        <div class="board-list" id="list"></div>
      </aside>

      <section class="pane" id="pane" data-for="sessions"></section>

      <aside class="board hidden" id="meetingsBoard" data-for="meetings">
        <div class="board-head">
          <div class="board-title"><span>Meetings</span><span class="board-count" id="meetingsCount"></span></div>
          <button class="btn danger sm" id="recordBtn"><span class="rec-dot"></span>Record</button>
        </div>
        <div class="board-list" id="meetingsList"></div>
      </aside>
      <section class="pane hidden" id="meetingsPane" data-for="meetings"></section>

      <aside class="board hidden" id="inboxBoard" data-for="inbox">
        <div class="board-head"><div class="board-title"><span>Inbox</span><span class="board-count" id="inboxCount"></span></div></div>
        <div class="board-list" id="inboxList"></div>
      </aside>
      <section class="pane hidden" id="inboxPane" data-for="inbox"></section>

      <aside class="board hidden" id="videosBoard" data-for="videos">
        <div class="board-head">
          <div class="board-title"><span>Videos</span><span class="board-count" id="videosCount"></span></div>
          <button class="btn danger sm" id="videoRecBtn"><span class="rec-dot"></span>Record</button>
        </div>
        <div class="board-list" id="videosList"></div>
      </aside>
      <section class="pane hidden" id="videosPane" data-for="videos"></section>

      <aside class="board hidden" id="agentsBoard" data-for="agents">
        <div class="board-head">
          <div class="board-title"><span>Agents</span><span class="board-count" id="agentsCount"></span></div>
          <button class="btn primary sm" id="agentNewBtn">
            <svg viewBox="0 0 16 16" width="11" height="11"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            New
          </button>
        </div>
        <div class="board-list" id="agentsList"></div>
      </aside>
      <section class="pane hidden" id="agentsPane" data-for="agents"></section>

      <aside class="board hidden" id="machinesBoard" data-for="machines">
        <div class="board-head"><div class="board-title"><span>Machines</span><span class="board-count">1</span></div></div>
        <div class="board-list" id="machinesList"></div>
      </aside>
      <section class="pane hidden" id="machinesPane" data-for="machines"></section>

      <aside class="board hidden" id="usageBoard" data-for="usage">
        <div class="board-head"><div class="board-title"><span>Claude logins</span><span class="board-count" id="usageCount"></span></div></div>
        <div class="board-list" id="usageList"></div>
      </aside>
      <section class="pane hidden" id="usagePane" data-for="usage"></section>
    </div>

    <footer class="statusbar">
      <span id="statusSummary"></span>
      <span class="statusbar-spacer"></span>
      <button class="link" id="configLink" title="Show the saved sessions file">Saved locally</button>
    </footer>
  </div>

  <div class="scrim hidden" id="scrim"></div>
  <div class="sheet hidden" id="newSheet" role="dialog" aria-label="New session"></div>
  <div class="sheet hidden" id="settingsSheet" role="dialog" aria-label="Settings"></div>
  <div class="palette hidden" id="palette" role="dialog" aria-label="Find a session">
    <input id="paletteInput" placeholder="Jump to a session…" spellcheck="false">
    <div id="paletteList"></div>
  </div>

  <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="presentation.js"></script>
  <script src="terminal-themes.js"></script>
  <script src="app.js"></script>
  <script src="agents.js"></script>
  <script src="machines.js"></script>
  <script src="usage.js"></script>
  <script src="meetings.js"></script>
  <script src="videos.js"></script>
  <script src="inbox.js"></script>
</body>
</html>
