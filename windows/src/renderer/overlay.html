<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Udha overlay</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    html, body { background: transparent !important; overflow: hidden; height: 100%; }
    body { user-select: none; }
    .ov { position: fixed; inset: 0; display: flex; justify-content: flex-end; }
    /* The strip: near-black, a hair wide, ticks centred vertically. */
    .strip { width: 14px; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: flex-end; gap: 5px; padding-right: 2px; }
    .ticks { display: flex; flex-direction: column; gap: 5px; align-items: flex-end; padding: 6px 2px 6px 3px; border-radius: 6px 0 0 6px; background: rgba(18, 18, 20, 0.82); box-shadow: 0 0 0 0.5px rgba(255,255,255,0.08); }
    .tick { width: 4px; border-radius: 2px; background: rgba(255,255,255,0.28); transition: height .22s cubic-bezier(.2,.9,.25,1), background .18s; }
    .tick.quiet { height: 8px; }
    .tick.ready { height: 12px; background: #45D669; }
    .tick.stale { height: 12px; background: #FFB340; }
    .tick.working { height: 22px; background: #4DA2FF; }
    .tick.needs { height: 34px; background: #FF6961; animation: tickpulse 1.2s ease-in-out infinite; }
    @keyframes tickpulse { 50% { opacity: .45; } }
    .panel { width: 340px; height: 100%; display: none; align-items: center; padding-right: 6px; }
    .bloomed .panel { display: flex; }
    .bloomed .strip { display: none; }
    .card.ovcard { width: 100%; max-height: 90vh; overflow-y: auto; padding: 10px; animation: bloom-in .28s cubic-bezier(.2,.9,.25,1); }
    @keyframes bloom-in { from { opacity: 0; transform: translateX(12px) scale(.98); } }
    .ovhead { display: flex; align-items: center; gap: 8px; padding: 2px 4px 8px; font-weight: 700; font-size: 12.5px; }
    .ovhead .n { font: 11px var(--mono); color: var(--tertiary); }
    .pill { display: flex; flex-direction: column; gap: 2px; padding: 7px 9px; border-radius: 8px; background: var(--fill); cursor: pointer; margin-top: 5px; transition: transform .22s cubic-bezier(.2,.9,.25,1); }
    .pill:hover { transform: translateX(-3px); background: var(--fill-strong); }
    .pill.wants { box-shadow: inset 0 0 0 1.5px var(--bad); }
    .pill .top { display: flex; align-items: center; gap: 7px; }
    .pill .name { font-weight: 600; font-size: 12px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pill .word { font-size: 11px; font-weight: 600; }
    .pill .det { font-size: 11px; color: var(--secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 13px; }
  </style>
</head>
<body>
  <div class="ov" id="ov">
    <div class="panel"><div class="card ovcard" id="panel"></div></div>
    <div class="strip"><div class="ticks" id="ticks"></div></div>
  </div>
  <script src="presentation.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
